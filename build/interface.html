:root{--red:#ff1226;--red2:#ff4a3d;--deep:#6b0009}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none}
body{font-family:'Sultan','Zain',sans-serif;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:max(env(safe-area-inset-bottom,0px),4px)}

/* static background layers (no repaint) */
.grid,.vig,#fx{position:fixed;inset:0;pointer-events:none}
.grid{z-index:0;opacity:.5;animation:gridp 5s ease-in-out infinite;
 background:
  repeating-linear-gradient(90deg,rgba(255,18,38,.10) 0 1px,transparent 1px 64px),
  repeating-linear-gradient(0deg,rgba(255,18,38,.10) 0 1px,transparent 1px 64px)}
@keyframes gridp{50%{opacity:.15}}
#fx{z-index:1;width:100%;height:100%}
.vig{z-index:5;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.85) 100%)}

/* red bar */
.redbar{position:relative;z-index:3;height:8px;background:linear-gradient(90deg,var(--deep),var(--red),#ff6a5c,var(--red),var(--deep));
 box-shadow:0 0 14px var(--red);overflow:hidden;flex:none}
.redbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,#fffa,transparent);
 transform:translateX(-100%);animation:sweep 2.6s linear infinite;will-change:transform}
@keyframes sweep{to{transform:translateX(350%)}}

/* compact strip */
.strip{position:relative;z-index:3;flex:none;display:grid;grid-template-columns:minmax(86px,.8fr) 2.2fr 40px;align-items:center;background:#000;
 border-bottom:1px solid rgba(255,18,38,.6);box-shadow:0 4px 16px rgba(255,18,38,.25)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 5px;text-align:center;min-width:0}
.cell+.cell::before{content:"";position:absolute;right:0;top:15%;bottom:15%;width:2px;border-radius:2px;
 background:linear-gradient(180deg,transparent,var(--red),#fff,var(--red),transparent);animation:zap 1.4s steps(1) infinite}
@keyframes zap{0%{opacity:1}30%{opacity:.3}34%{opacity:1}70%{opacity:.55}74%{opacity:1}}
.time{font-family:'Sultan';font-size:clamp(15px,4.6vw,26px);color:#fff;direction:ltr;font-variant-numeric:tabular-nums;
 text-shadow:0 0 10px var(--red)}
.date{font-size:clamp(9px,2.5vw,13px);line-height:1.25;color:#ffb0b6}
.live{display:inline-block;width:5px;height:5px;margin-inline-end:3px;border-radius:50%;background:var(--red);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}


.welcome{position:relative;width:100%;padding:2px;border-radius:10px;overflow:hidden;isolation:isolate}
.welcome::before{content:"";position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;margin:-150% 0 0 -150%;z-index:-1;
 background:conic-gradient(from 0deg,transparent 0 62%,var(--red) 80%,#fff 88%,transparent 92%);animation:spin 3s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome .in{background:#050001;border-radius:8px;padding:9px 8px;text-align:center;font-family:'Zain','Sultan',sans-serif;font-size:clamp(15px,4.8vw,28px);line-height:1.3;overflow:hidden}
.welcome .in span{font-family:'Rusty',sans-serif;color:var(--red);letter-spacing:.06em;display:inline-block;direction:ltr}
.g{position:relative;display:block}
.g .l0{position:relative}
.g .l1,.g .l2{position:absolute;inset:0;pointer-events:none;will-change:transform,clip-path}
.g .l1{color:#00e5ff;clip-path:inset(0 0 62% 0);animation:g1 3.2s steps(1) infinite}
.g .l2{color:#ff0033;clip-path:inset(58% 0 0 0);animation:g2 2.7s steps(1) infinite}
.g .l1 span,.g .l2 span{color:inherit}
.g .l0{animation:gjit 3.2s steps(1) infinite}
@keyframes g1{0%,70%,100%{transform:none;opacity:0}72%{transform:translateX(-4px);opacity:.9;clip-path:inset(10% 0 55% 0)}76%{transform:translateX(3px);opacity:.9;clip-path:inset(40% 0 25% 0)}80%{transform:translateX(-2px);opacity:.9;clip-path:inset(0 0 70% 0)}84%{transform:none;opacity:0}}
@keyframes g2{0%,55%,100%{transform:none;opacity:0}57%{transform:translateX(4px);opacity:.9;clip-path:inset(60% 0 5% 0)}61%{transform:translateX(-3px);opacity:.9;clip-path:inset(25% 0 45% 0)}65%{transform:translateX(2px);opacity:.9;clip-path:inset(70% 0 0 0)}69%{transform:none;opacity:0}}
@keyframes gjit{0%,71%,100%{transform:none}73%{transform:skewX(-8deg)}78%{transform:translateX(2px) skewX(4deg)}83%{transform:none}}

/* dots */
.dots{background:none;border:0;cursor:pointer;display:grid;place-items:center;width:100%;height:44px}
.dots svg{width:20px;height:34px;overflow:visible}
.dots circle{fill:#ff2a3c;stroke:#fff;stroke-width:1}
.dots .arc{fill:none;stroke:#ff8088;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dots{position:relative}
.dots::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(255,18,38,.55),transparent 70%);animation:glowop 1.6s ease-in-out infinite}
@keyframes glowop{50%{opacity:.3}}

/* menu */
.menu{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 100px);right:10px;width:min(210px,calc(100vw - 20px));
 background:linear-gradient(160deg,#120004,#030303 60%);border:1px solid var(--red);border-radius:14px;padding:8px;
 box-shadow:0 0 24px rgba(255,18,38,.5);transform:translateX(120%);opacity:0;visibility:hidden;
 transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .2s,visibility 0s .3s;will-change:transform}
.menu.open{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.menu h4{font-family:'Courier New',monospace;direction:ltr;font-size:11px;letter-spacing:3px;color:var(--red2);margin:2px 4px 8px;text-align:left}
.btn{position:relative;display:flex;align-items:center;gap:10px;padding:8px;margin-top:7px;border-radius:12px;text-decoration:none;color:#fff;
 background:#0a0a0c;border:1px solid rgba(255,18,38,.5);overflow:hidden;cursor:pointer;width:100%;font:inherit;text-align:start;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 18px var(--red),0 0 14px var(--red);animation:glowop 2.4s ease-in-out infinite;opacity:.9;pointer-events:none}
.btn:nth-of-type(2)::before{animation-delay:.5s}.btn:nth-of-type(3)::before{animation-delay:1s}
.menu:not(.open) .btn::before{animation:none}
.ico{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#000;border:1px solid rgba(255,18,38,.6)}
.ico svg{width:17px;height:17px;fill:#fff}
.txt{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.txt b{font-family:'Sultan';font-size:13px;font-weight:400}
.txt code{font-family:'Courier New',monospace;font-size:13px;color:#ff6b78;direction:ltr;text-align:left}

/* lens at bottom */
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px 6px;min-height:0}
.scanwrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.lensbtn{position:relative;width:72px;height:72px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;transition:transform .12s;touch-action:manipulation}
.lensbtn:active{transform:scale(.86)}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,18,38,.75);box-shadow:0 0 14px rgba(255,18,38,.55)}
.ring.r2{inset:9px;border-style:dashed;animation:spin 9s linear infinite reverse}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,18,38,.7),transparent 28%);animation:spin 2.4s linear infinite;opacity:.5;will-change:transform}
.lensbtn.on .sweep{animation-duration:.8s;opacity:.9}
.lensbtn.on .ring{animation:pop .9s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.08)}}
.core{position:relative;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a5c,var(--red) 45%,#5a0008);display:grid;place-items:center}
.core::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 22px var(--red),0 0 44px rgba(255,18,38,.6);animation:glowop 2s ease-in-out infinite}
.core svg{position:relative;width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.wave{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid #fff;pointer-events:none;
 animation:wave .8s ease-out forwards;will-change:transform,opacity}
@keyframes wave{from{transform:scale(1);opacity:1}to{transform:scale(5);opacity:0}}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 100%,rgba(255,18,38,.45),transparent 60%);animation:fl .45s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.setup-guide{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:7px 10px;margin:5px 10px 0;border:1px solid rgba(255,18,38,.38);border-radius:9px;background:#100004;color:#ffd9dc;font-size:12px}.setup-guide span{display:inline-flex;align-items:center;gap:4px}.setup-guide svg{width:15px;height:15px;stroke:#ff5361;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.setup-guide i{height:14px;width:1px;background:#6b0009}
.status{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;
 padding:7px 18px;font-size:clamp(12px,3.4vw,15px);color:#ffd9dc;text-align:center;
 background:linear-gradient(90deg,#000,#2a0006 20%,#3a0008 50%,#2a0006 80%,#000);
 border-bottom:1px dashed rgba(255,18,38,.8);box-shadow:0 3px 14px rgba(255,18,38,.3);
 clip-path:polygon(0 0,100% 0,100% 100%,18px 100%,0 calc(100% - 8px))}
.status::before{content:"";position:absolute;top:0;bottom:0;left:0;width:25%;background:linear-gradient(90deg,transparent,rgba(255,60,70,.35),transparent);
 transform:translateX(-100%);animation:sweep 3.4s linear infinite;will-change:transform}
.status span{position:relative;text-shadow:0 0 8px rgba(255,18,38,.9)}
.chev{position:relative;font-style:normal;color:var(--red);letter-spacing:-2px;font-size:13px;animation:blink 1s steps(1) infinite}
.cur{position:relative;width:8px;height:14px;background:var(--red);animation:blink .8s steps(1) infinite;box-shadow:0 0 8px var(--red)}
.status b{font-family:'Courier New',monospace;color:#fff;direction:ltr;display:inline-block}

/* demo pairing sheet */
.sheet{position:relative;width:min(560px,100%);flex:0 1 auto;min-height:0;margin:10px 0 8px;display:flex;flex-direction:column;
 border:1px solid rgba(255,18,38,.75);border-radius:12px;background:#050001;box-shadow:0 0 14px rgba(255,18,38,.35);overflow:hidden;contain:layout paint;
 animation:up .25s ease-out}
.sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,18,38,.4);font-size:13px}
.sh-head>span:first-child{display:flex;align-items:center;gap:6px}
.sh-head svg{width:14px;height:14px;stroke:var(--red2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#000;background:var(--red);padding:2px 7px;border-radius:4px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px;background:none;border:0;border-bottom:1px solid rgba(255,18,38,.18);color:#fff;font:inherit;text-align:start}
button.row{cursor:pointer}
button.row:active{background:rgba(255,18,38,.2)}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#1a0004;border:1px solid var(--red);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg,.call svg{width:14px;height:14px;stroke:#ff8088;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.call{flex:none;display:grid;place-items:center}
.rt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.rt b{font-weight:400;font-size:13px;line-height:1.2}
.rt small{font-family:'Courier New',monospace;font-size:11px;color:#ff8088;direction:ltr;text-align:start;line-height:1.2}
.sig{flex:none;display:flex;gap:2px;align-items:flex-end;height:16px;direction:ltr}
.sig i{width:4px;background:var(--red);border-radius:1px}
.pwrap{padding:16px 14px;text-align:center;font-size:14px;color:#ffd9dc}
.pbar{height:5px;margin-top:12px;border-radius:3px;background:#2a0006;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--red);transform-origin:right;transform:scaleX(0);animation:fill 1.6s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.acts{flex:none;display:flex;gap:6px;padding:6px;border-top:1px solid rgba(255,18,38,.4)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:8px;font:inherit;font-size:12px;color:#fff;background:#0a0a0c;border:1px solid var(--red);cursor:pointer}
.acts button.pri{background:var(--red);color:#000}
.acts svg{flex:none;width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.acts button:active{transform:scale(.97)}
.acts button.dis{opacity:.45}
.ico2{display:inline-block;width:1em;height:1em;vertical-align:-.12em;margin-inline-end:4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status .ico2{width:15px;height:15px;stroke:#fff;margin:0;filter:drop-shadow(0 0 4px var(--red))}
.date .ico2{width:10px;height:10px;stroke:#ffb0b6}
/* selection toolbar + checkboxes */
.tb{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;border-bottom:1px solid rgba(255,18,38,.3);font-size:12px;color:#ffd9dc}
.tb button{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font:inherit;font-size:12px;color:#fff;background:#0a0a0c;border:1px solid var(--red);cursor:pointer}
.tb button:active{transform:scale(.96)}
.tb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cnt{display:flex;align-items:center;gap:5px;font-family:'Courier New',monospace;direction:ltr}
.cnt svg{width:13px;height:13px;stroke:var(--red2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row[data-i]{opacity:.55;transition:background .15s,opacity .15s,box-shadow .15s}
.chk{flex:none;width:20px;height:20px;border:2px solid rgba(255,18,38,.55);border-radius:6px;display:grid;place-items:center;background:#000;transition:.15s}
.chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.3);transition:.15s}
.row.on{opacity:1;background:linear-gradient(90deg,rgba(255,18,38,.42),rgba(255,18,38,.12));box-shadow:inset -4px 0 0 var(--red),inset 0 0 16px rgba(255,18,38,.35)}
.row.on .chk{background:var(--red);border-color:#fff;box-shadow:0 0 10px var(--red)}
.row.on .chk svg{opacity:1;transform:none}
.row.on .av{border-color:#fff;box-shadow:0 0 8px var(--red)}
.row.on .rt b{text-shadow:0 0 8px var(--red)}
.row .call{opacity:.6}
.big{width:34px;height:34px;display:block;margin:0 auto 8px;stroke:var(--red2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:glowop 1.2s ease-in-out infinite}

.status[data-state="ok"]{color:#c9ffd9;border-color:rgba(72,220,135,.42)}
.status[data-state="error"]{color:#ffb9c0;border-color:rgba(255,50,80,.55)}
.status[data-state="wait"]{color:#ffe4e7;border-color:rgba(255,18,38,.5)}
.status-mark{display:inline-flex;width:16px;height:16px;flex:none}
.status-mark svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nearby-empty{padding:22px 14px;text-align:center;color:#d6aeb2;font-size:13px}

/* ZEUS text-copy protection: screenshots and screen recording remain enabled. */
html,body,body *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none!important}
input,textarea,[contenteditable="true"]{-webkit-user-select:text!important;user-select:text!important}
</style>
</head>

<script>
// Block ordinary clipboard/selection routes without blocking screenshots or screen recording.
document.addEventListener('copy',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('cut',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('contextmenu',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"]'))e.preventDefault()},true);
window.addEventListener('pageshow',()=>{const w=document.querySelector('.welcome');if(w){w.style.visibility='visible';w.style.opacity='1';const g=w.querySelector('.g');if(g){g.style.visibility='visible';g.style.opacity='1'}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const w=document.querySelector('.welcome');if(w){w.style.visibility='visible';w.style.opacity='1'}}});

// clock (time each second, date only when text changes)
const tEl=document.getElementById('time'),dEl=document.getElementById('date');
const tf=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const df=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
let lastD='';
function tick(){const n=new Date();tEl.textContent=tf.format(n);const d=df.format(n);if(d!==lastD){dEl.textContent=d;lastD=d}}
tick();setInterval(tick,1000);

// menu
const dots=document.getElementById('dots'),menu=document.getElementById('menu');
function setMenu(o){menu.classList.toggle('open',o);dots.setAttribute('aria-expanded',o)}
dots.onclick=e=>{e.stopPropagation();setMenu(!menu.classList.contains('open'))};
document.getElementById('openLog').onclick=()=>{setMenu(false);renderLog()};
document.addEventListener('click',e=>{if(!menu.contains(e.target))setMenu(false)});
document.getElementById('exit').onclick=()=>{
  window.close();
  setTimeout(()=>{document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#ff1226;font-family:monospace;letter-spacing:4px">SESSION TERMINATED</div>';
    setTimeout(()=>{location.href='about:blank'},900)},250);
};

// ZEUS native Bluetooth and PBAP contacts.
const lens=document.getElementById('lens'),st=document.getElementById('status'),statusBar=document.getElementById('livebar'),statusIcon=document.getElementById('statusIcon'),sheet=document.getElementById('sheet');
let scanStarted=false,lastSnapshot='',view='devices',selected=new Set(),contactsCache=[],lastTransferState='';
const IC={
 radar:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/></svg>',
 phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 bt:'<svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 4.5V2.5L17 7 7 17"/></svg>',
 call:'<svg viewBox="0 0 24 24"><path d="M5 4h3.5l1.8 4.5-2.2 1.4a11 11 0 0 0 6 6l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A15.5 15.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></svg>',
 txt:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 all:'<svg viewBox="0 0 24 24"><path d="m3 7 2.5 2.5L10 5M3 17l2.5 2.5L10 15M14 7h7M14 17h7"/></svg>',
 none:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
 alert:'<svg viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3z"/><path d="M12 9v4m0 3h.01"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
 wait:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(t,i){return '<div class="sh-head"><span>'+(IC[i]||'')+t+'</span><span class="badge">ZEUS LIVE</span></div>'}
function show(h){sheet.innerHTML=h;sheet.hidden=false}
function status(kind,msg){statusBar.dataset.state=kind;statusIcon.innerHTML=IC[kind==='ok'?'ok':kind==='error'?'alert':'wait'];st.textContent=msg}
function parse(method){try{const v=ZEUS[method]();return typeof v==='string'?JSON.parse(v):v||[]}catch(e){return []}}
function renderDevices(force){
 if(!window.ZEUS||view!=='devices')return;
 try{
  const near=parse('discoveredDevices'),active=!!ZEUS.isDiscovering(),snap=JSON.stringify([near,active]);
  lens.classList.toggle('on',active);
  if(active)status('wait','جاري فحص الأجهزة القريبة...');
  else if(scanStarted){let diagnostic='';try{diagnostic=ZEUS.scanMessage?ZEUS.scanMessage():''}catch(e){}status(near.length?'ok':'error',near.length?'اكتمل البحث. اختر الجهاز المطلوب.':(diagnostic||'انتهى البحث. تأكد أن الجهاز الآخر في وضع الظهور (Discoverable) وأن Bluetooth والموقع مفعّلان.'));}
  if(!force&&snap===lastSnapshot)return;lastSnapshot=snap;
  const row=d=>'<button class="row" data-a="connect" data-address="'+safe(d.address)+'"><span class="av">'+IC.phone+'</span><span class="rt"><b>'+safe(d.name||'Bluetooth Device')+'</b><small>'+safe(d.address)+'</small></span><span class="call">'+IC.bt+'</span><span class="badge">'+(d.paired?'PAIRED':'AVAILABLE')+'</span></button>';
  show(head('الأجهزة المكتشفة الآن','radar')+'<div class="tb"><span class="cnt">نتائج البحث الحالي · '+near.length+'</span></div><div class="sh-body">'+(near.length?near.map(row).join(''):'<div class="nearby-empty">'+(active?'يتم البحث عن الأجهزة القريبة الآن...':'اضغط العدسة لبدء البحث عن أجهزة قريبة')+'</div>')+'</div>');
 }catch(e){status('error','تعذّرت قراءة نتائج البحث.')}
}
function startScan(){
 if(!window.ZEUS){status('error','خدمة Bluetooth غير متاحة داخل التطبيق.');return}
 view='devices';scanStarted=true;lastSnapshot='';selected.clear();contactsCache=[];status('wait','جاري تهيئة البحث...');
 try{ZEUS.scan();renderDevices(true)}catch(e){status('error','تعذّر بدء البحث عن الأجهزة.')}
}
lens.onclick=()=>{if(view!=='transfer')startScan()};
function showTransfer(kind,msg){view='transfer';status('wait',msg||'جارٍ تنفيذ الاتصال بالجهاز...');show(head(kind==='pairing'?'جارٍ الاقتران':kind==='connecting'?'جارٍ الاتصال':'جارٍ استلام جهات الاتصال','radar')+'<div class="pwrap">'+IC.bt+'<div>'+safe(msg||'انتظر حتى يكتمل الاتصال بالجهاز...')+'</div><div class="pbar"><i></i></div></div>')}
function renderContacts(items){
 view='contacts';contactsCache=items;selected.clear();
 if(!items.length){show(head('جهات الاتصال','user')+'<div class="nearby-empty">الجهاز لم يُرجع جهات اتصال قابلة للعرض.</div><div class="acts"><button data-a="back">'+IC.radar+'العودة للأجهزة</button></div>');status('error','لم يتم استلام جهات اتصال من الجهاز.');return}
 const rows=items.map((c,i)=>'<button class="row" data-a="toggle" data-i="'+i+'"><span class="chk">'+IC.check+'</span><span class="av">'+IC.user+'</span><span class="rt"><b>'+safe(c.name||'بدون اسم')+'</b><small>'+safe(c.phone||'بدون رقم')+'</small></span><span class="call">'+IC.call+'</span></button>').join('');
 show(head('جهات الاتصال المستلمة','user')+'<div class="tb"><button data-a="all" id="allbtn">'+IC.all+'تحديد الكل</button><span class="cnt" id="cnt">'+IC.list+'0 / '+items.length+'</span></div><div class="sh-body">'+rows+'</div><div class="acts"><button class="pri" data-a="save-all" type="button" aria-label="حفظ كل الجهات في السجل" title="حفظ كل الجهات في السجل"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-7-4-7 4zM8 8h8"/></svg></button><button class="dis" data-a="txt" type="button" aria-label="تنزيل الجهات المحددة بصيغة TXT" title="تنزيل المحدد TXT"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg></button><button data-a="back" type="button" aria-label="العودة إلى الأجهزة" title="العودة إلى الأجهزة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg></button></div>');
 syncSelection();status('ok','تم استلام '+items.length+' جهة اتصال — اختر ما تريد حفظه أو تنزيله.');
}
function syncSelection(){
 sheet.querySelectorAll('.row[data-i]').forEach(r=>r.classList.toggle('on',selected.has(+r.dataset.i)));
 const all=selected.size===contactsCache.length,b=document.getElementById('allbtn'),c=document.getElementById('cnt');
 if(b)b.innerHTML=(all?IC.none:IC.all)+(all?'إلغاء تحديد الكل':'تحديد الكل');
 if(c)c.innerHTML=IC.list+selected.size+' / '+contactsCache.length;
 if(view==='contacts')status('wait',selected.size?'تم تحديد '+selected.size+' من '+contactsCache.length+' جهة اتصال.':'حدد الجهات المطلوبة — '+contactsCache.length+' جهة متاحة.');
 const dl=sheet.querySelector('[data-a="txt"]');if(dl)dl.classList.toggle('dis',!selected.size);
}
function saveAllToLog(){if(!contactsCache.length){status('error','لا توجد جهات اتصال لحفظها.');return}try{const key='ZEUS_CONTACTS_LOG_V1',old=JSON.parse(localStorage.getItem(key)||'[]'),source=window.ZEUS&&ZEUS.currentDeviceName?String(ZEUS.currentDeviceName()):'Bluetooth Device',savedAt=new Date().toISOString();const add=contactsCache.map(c=>({name:c.name||'بدون اسم',phone:c.phone||'بدون رقم',source,savedAt}));localStorage.setItem(key,JSON.stringify(old.concat(add).slice(-5000)));status('ok','تم حفظ '+add.length+' جهة اتصال في سجل الجهات داخل التطبيق.')}catch(e){status('error','تعذّر الحفظ في السجل المحلي.')}}
function renderLog(){let a=[];try{a=JSON.parse(localStorage.getItem('ZEUS_CONTACTS_LOG_V1')||'[]')}catch(e){}view='log';const rows=a.slice().reverse().map(c=>'<div class="row"><span class="av">'+IC.user+'</span><span class="rt"><b>'+safe(c.name)+'</b><small>'+safe(c.phone)+' · '+safe(c.source)+'</small></span></div>').join('');show(head('سجل الجهات المحفوظة','user')+'<div class="tb"><span class="cnt">'+a.length+' جهة محفوظة محلياً</span></div><div class="sh-body">'+(rows||'<div class="nearby-empty">السجل فارغ.</div>')+'</div><div class="acts"><button data-a="back">رجوع للأجهزة</button></div>');status('ok','السجل محفوظ على هذا الهاتف فقط.')}
function downloadTxt(){
 const rows=contactsCache.filter((_,i)=>selected.has(i));
 if(!rows.length){status('error','حدد جهة اتصال واحدة على الأقل قبل تنزيل ملف TXT.');return}
 const n=new Date();
 const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(n);
 const time=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false}).format(n);
 const body='\uFEFFZEUS CONTACT EXPORT\nOperation completed by ZEUS\nDate: '+date+'\nTime: '+time+'\nTelegram: @ll4me\n\nCONTACTS\n'+rows.map((c,i)=>String(i+1).padStart(2,'0')+'. '+(c.name||'بدون اسم')+'\n   '+(c.phone||'بدون رقم')).join('\r\n\r\n')+'\n\nTOTAL CONTACTS: '+rows.length+'\r\n';
 try{
  const result=String(ZEUS.saveContactsTxt(body)||'');
  if(result.startsWith('OK:'))status('ok','تم حفظ '+rows.length+' جهة اتصال في التنزيلات باسم '+result.slice(3));
  else status('error',result.startsWith('ERROR:')?result.slice(6):'لم يتم حفظ الملف. حاول مرة أخرى.');
 }catch(e){status('error','تعذّر حفظ ملف TXT داخل الهاتف.')}
}
sheet.onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='connect'){const address=b.dataset.address;if(!address)return;showTransfer('pairing','جارٍ الاقتران بالجهاز. سيبدأ سحب دفتر الهاتف بعد اكتمال الاقتران.');try{const r=ZEUS.connect(address);if(r==='connecting')showTransfer('connecting','الجهاز مقترن بالفعل. جارٍ الاتصال بدفتر الهاتف...')}catch(err){view='devices';status('error','تعذّر بدء الاقتران أو الاتصال.')}}
 else if(a==='toggle'){const i=+b.dataset.i;selected.has(i)?selected.delete(i):selected.add(i);syncSelection()}
 else if(a==='all'){if(selected.size===contactsCache.length)selected.clear();else contactsCache.forEach((_,i)=>selected.add(i));syncSelection()}
 else if(a==='txt')downloadTxt(false);
 else if(a==='save-all')saveAllToLog();
 else if(a==='back'){try{if(window.ZEUS&&ZEUS.cancelTransfer)ZEUS.cancelTransfer()}catch(e){}lastTransferState='';view='devices';selected.clear();contactsCache=[];lastSnapshot='';renderDevices(true);status('ok','رجعت لقائمة الأجهزة — اضغط العدسة للبحث من جديد.')}
};
function getTransferStatus(){try{const v=ZEUS.transferStatus();return typeof v==='string'?JSON.parse(v):v||{}}catch(e){return {}}}
function getContacts(){try{const v=ZEUS.contacts();return typeof v==='string'?JSON.parse(v):v||[]}catch(e){return []}}
function pollBridge(){
 if(!window.ZEUS)return;
 const info=getTransferStatus();
 if(info&&info.state){
  if(info.state==='pairing'){if(view!=='transfer'||lastTransferState!==info.state)showTransfer('pairing',info.message);lastTransferState=info.state}
  else if(info.state==='connecting'||info.state==='transferring'){if(view!=='transfer'||lastTransferState!==info.state)showTransfer(info.state,info.message);else{const p=sheet.querySelector('.pwrap div');if(p&&info.message)p.textContent=info.message;status('wait',info.message||'جارٍ نقل جهات الاتصال...')}lastTransferState=info.state}
  else if(info.state==='done'&&view!=='contacts'){lastTransferState='done';renderContacts(getContacts())}
  else if(info.state==='error'&&view!=='error'){view='error';lastTransferState='error';show(head('تعذّر نقل جهات الاتصال','alert')+'<div class="nearby-empty">'+safe(info.message||'الجهاز لم يسمح بالوصول إلى دفتر الهاتف.')+'</div><div class="acts"><button data-a="back">'+IC.radar+'العودة للأجهزة</button></div>');status('error',info.message||'تعذّر استلام جهات الاتصال.')}
 }
 if(view==='devices')renderDevices(false);
}
setInterval(pollBridge,650);
// Keep the original lens pulse, flash and touch feedback.
lens.addEventListener('pointerdown',()=>{
 if(navigator.vibrate)navigator.vibrate(20);
 for(let i=0;i<2;i++){const w=document.createElement('span');w.className='wave';w.style.animationDelay=(i*.15)+'s';lens.appendChild(w);setTimeout(()=>w.remove(),1100)}
 const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),500);spawn();spawn();
});

// electric dots arcs (low rate, no filters)
const A=[document.getElementById('a1'),document.getElementById('a2')],ys=[10,28,46];
function zig(y1,y2){let p='M17 '+(y1+5);for(let i=1;i<=4;i++){const y=y1+5+(y2-y1-10)*i/4;p+=' L'+(17+(i<4?(Math.random()-.5)*18:0)).toFixed(1)+' '+y.toFixed(1)}return p}
let dotT=setInterval(()=>{if(document.hidden)return;A.forEach((el,i)=>{el.setAttribute('d',zig(ys[i],ys[i+1]));el.style.opacity=Math.random()<.3?0:1})},140);

// lightning canvas: cheap (no shadowBlur, 1 path per pass, ~30fps, idle when empty)
const cv=document.getElementById('fx'),cx=cv.getContext('2d',{alpha:true});let W,H,bolts=[],raf=0,last=0,nextB=0,running=true;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rs();addEventListener('resize',rs);
function bolt(x1,y1,x2,y2,d,out){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  if(d>=5||len<14){out.push(x1,y1,x2,y2);return}
  const mx=(x1+x2)/2+(Math.random()-.5)*len*.38,my=(y1+y2)/2+(Math.random()-.5)*len*.38;
  bolt(x1,y1,mx,my,d+1,out);bolt(mx,my,x2,y2,d+1,out);
  if(d>1&&Math.random()<.18){const a=Math.atan2(y2-my,x2-mx)+(Math.random()-.5)*1.4,l=len*.7;bolt(mx,my,mx+Math.cos(a)*l,my+Math.sin(a)*l,d+2,out)}
}
function spawn(){
  if(bolts.length>=3)return;
  const s=Math.random(),seg=[];let x1,y1,x2,y2;
  if(s<.5){x1=Math.random()*W;y1=0;x2=W*.3+Math.random()*W*.4;y2=H*(.4+Math.random()*.4)}
  else if(s<.75){x1=0;y1=H*Math.random();x2=W*.3;y2=H*Math.random()}
  else{x1=W;y1=H*Math.random();x2=W*.7;y2=H*Math.random()}
  bolt(x1,y1,x2,y2,0,seg);bolts.push({seg,life:1});
  if(!raf&&running)raf=requestAnimationFrame(frame);
}
function frame(t){
  raf=0;
  if(t-last<33){raf=requestAnimationFrame(frame);return}
  last=t;
  cx.clearRect(0,0,W,H);
  cx.lineCap='round';
  for(const b of bolts){
    const s=b.seg,a=b.life;
    cx.beginPath();for(let i=0;i<s.length;i+=4){cx.moveTo(s[i],s[i+1]);cx.lineTo(s[i+2],s[i+3])}
    cx.strokeStyle='rgba(255,18,38,'+(a*.28)+')';cx.lineWidth=7;cx.stroke();
    cx.strokeStyle='rgba(255,235,235,'+a+')';cx.lineWidth=1.4;cx.stroke();
    b.life-=.07;
  }
  bolts=bolts.filter(b=>b.life>0);
  if(bolts.length)raf=requestAnimationFrame(frame);else cx.clearRect(0,0,W,H);
}
function loopSpawn(){if(running&&state==='idle'){spawn();if(Math.random()<.3)spawn()}setTimeout(loopSpawn,1000+Math.random()*1800)}
loopSpawn();
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running&&bolts.length&&!raf)raf=requestAnimationFrame(frame)});
</script>
